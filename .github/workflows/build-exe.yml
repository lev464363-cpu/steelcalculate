name: Сборка exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]          # метка версии (v1.0 …) — ещё и релиз с архивом
  workflow_dispatch:
    inputs:
      version:
        description: "Метка версии для релиза, например v1.0 (пусто — только сборка)"
        required: false

permissions:
  contents: write         # для публикации релиза

jobs:
  windows:
    runs-on: windows-latest
    env:
      # кириллица в выводе: консоль сборщика — не UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # версия релиза: метка, на которую пришёл пуш, или введённая при ручном запуске
      REL: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка расчётов
        run: python tests/test_calc.py
      - name: Сборка
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Kalkulyator-volocheniya-windows
          path: dist/
      - name: Архив для релиза
        if: env.REL != ''
        run: python -c "import build_exe, os; build_exe.pack('dist', 'Kalkulyator-volocheniya-' + os.environ['REL'] + '-windows.zip')"
      - name: Релиз
        if: env.REL != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # релиза нет — создать (метку GitHub ставит сам на собранный коммит); есть — заменить архив
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $zip = "Kalkulyator-volocheniya-$($env:REL)-windows.zip"
          gh release view $env:REL 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:REL $zip --clobber
          } else {
            gh release create $env:REL $zip --target $env:GITHUB_SHA `
              --title "Калькулятор волочения $($env:REL)" --notes-file "release-notes/$($env:REL).md"
          }
